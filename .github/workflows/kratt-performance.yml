name: KRATT performance integration benchmark

on:
  push:
    branches:
      - feature/wave4-performance-security-hardening-2026-11-27
  pull_request:
    branches:
      - main
    paths:
      - "packages/kratt-core/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/kratt-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorized-dispatch-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run 4x4 end-to-end benchmark smoke matrix
        run: npm run bench:runtime
        env:
          KRATT_BENCH_ITERATIONS: "25"
          KRATT_BENCH_WARMUP: "5"
          KRATT_BENCH_EVIDENCE_COUNTS: "1,8,32,128"
          KRATT_BENCH_CONCURRENCY: "1,4,16,64"
          KRATT_BENCH_ROUNDS: "3"
          KRATT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Upload benchmark JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kratt-wave4-1-benchmark-${{ github.event.pull_request.head.sha || github.sha }}
          path: benchmarks/results/*.json
          if-no-files-found: warn
          retention-days: 14
