name: Trusted Wave evidence gates

on:
  push:
    branches:
      - feature/wave1-10-trusted-evidence-gates-2026-11-20

permissions:
  contents: read

jobs:
  trusted-wave-gates:
    name: Trusted evidence and full repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Wave registry, trusted verifier and UI tests
        run: node --test packages/kratt-core/test/wave-progression.test.mjs packages/kratt-core/test/trusted-wave-gate.test.mjs packages/kratt-core/test/control-desk-contract.test.mjs
      - name: Complete contract suite
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
