name: KRATT Phase 11 Phase Upgrade Engine

on:
  push:
    branches:
      - feature/phase11-phase-upgrade-engine-v1
    paths:
      - "packages/kratt-core/src/hardware-capabilities.mjs"
      - "packages/kratt-core/src/phase-upgrade-engine.mjs"
      - "packages/kratt-core/test/phase-upgrade-engine.test.mjs"
      - ".github/workflows/phase11-phase-upgrade-engine.yml"
  pull_request:
    branches:
      - feature/wave10-observatory-hardening-remediation-v1
    paths:
      - "packages/kratt-core/src/hardware-capabilities.mjs"
      - "packages/kratt-core/src/phase-upgrade-engine.mjs"
      - "packages/kratt-core/test/phase-upgrade-engine.test.mjs"
      - ".github/workflows/phase11-phase-upgrade-engine.yml"

permissions:
  contents: read

jobs:
  phase-upgrade-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check packages/kratt-core/src/hardware-capabilities.mjs
          node --check packages/kratt-core/src/phase-upgrade-engine.mjs
      - name: Run Phase 11 contract tests
        run: node --test packages/kratt-core/test/phase-upgrade-engine.test.mjs
