name: KRATT Phase 11 Phase Upgrade Engine

on:
  push:
    branches:
      - feature/phase11-phase-upgrade-engine-v1
    paths:
      - "packages/kratt-core/src/hardware-capabilities.mjs"
      - "packages/kratt-core/src/phase-upgrade-engine.mjs"
      - "packages/kratt-core/src/observed-operation.mjs"
      - "packages/kratt-core/src/runtime-observatory.mjs"
      - "packages/kratt-core/src/phase11-wave10-integration.mjs"
      - "packages/kratt-core/src/phase11-migration-contract.mjs"
      - "packages/kratt-orchestrator/src/phase11-runtime.mjs"
      - "packages/kratt-orchestrator/test/phase11-runtime.test.mjs"
      - "packages/kratt-core/test/phase-upgrade-engine.test.mjs"
      - "packages/kratt-core/test/phase11-wave10-integration.test.mjs"
      - "packages/kratt-core/test/phase11-migration-contract.test.mjs"
      - "scripts/wave8-apply-migration.mjs"
      - ".github/workflows/phase11-phase-upgrade-engine.yml"
  pull_request:
    branches:
      - feature/wave10-observatory-hardening-remediation-v1
    paths:
      - "packages/kratt-core/src/hardware-capabilities.mjs"
      - "packages/kratt-core/src/phase-upgrade-engine.mjs"
      - "packages/kratt-core/src/observed-operation.mjs"
      - "packages/kratt-core/src/runtime-observatory.mjs"
      - "packages/kratt-core/src/phase11-wave10-integration.mjs"
      - "packages/kratt-core/src/phase11-migration-contract.mjs"
      - "packages/kratt-core/test/phase-upgrade-engine.test.mjs"
      - "packages/kratt-core/test/phase11-wave10-integration.test.mjs"
      - "packages/kratt-core/test/phase11-migration-contract.test.mjs"
      - "scripts/wave8-apply-migration.mjs"
      - ".github/workflows/phase11-phase-upgrade-engine.yml"

permissions:
  contents: read

jobs:
  phase-upgrade-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check packages/kratt-core/src/hardware-capabilities.mjs
          node --check packages/kratt-core/src/runtime-observatory.mjs
          node --check packages/kratt-core/src/observed-operation.mjs
          node --check packages/kratt-core/src/phase-upgrade-engine.mjs
          node --check packages/kratt-core/src/phase11-wave10-integration.mjs
          node --check packages/kratt-core/src/phase11-migration-contract.mjs
          node --check packages/kratt-orchestrator/src/phase11-runtime.mjs
          node --check scripts/wave8-apply-migration.mjs
      - name: Run Phase 11, Wave 10 integration and migration contracts
        run: |
          node --test packages/kratt-core/test/phase-upgrade-engine.test.mjs
          node --test packages/kratt-core/test/phase11-wave10-integration.test.mjs
          node --test packages/kratt-core/test/phase11-migration-contract.test.mjs
          node --test packages/kratt-orchestrator/test/phase11-runtime.test.mjs
