name: KRATT Word Semantics

on:
  push:
    branches:
      - feature/phase11-phase-upgrade-engine-v1
    paths:
      - "packages/kratt-core/src/word-semantic-model.mjs"
      - "packages/kratt-core/src/semantic-evidence-bridge.mjs"
      - "packages/kratt-core/src/semantic-ingestion-runtime.mjs"
      - "packages/kratt-core/test/semantic-ingestion-runtime.test.mjs"
      - "packages/kratt-core/src/memory-ledger.mjs"
      - "packages/kratt-core/src/contracts.mjs"
      - "packages/kratt-core/test/word-semantic-evidence-bridge.test.mjs"
      - "packages/kratt-core/test/word-semantic-model.test.mjs"
      - "docs/WORD-SEMANTIC-MODEL.md"
      - ".github/workflows/word-semantic-model.yml"
  pull_request:
    branches:
      - feature/wave10-observatory-hardening-remediation-v1
    paths:
      - "packages/kratt-core/src/word-semantic-model.mjs"
      - "packages/kratt-core/src/semantic-evidence-bridge.mjs"
      - "packages/kratt-core/src/semantic-ingestion-runtime.mjs"
      - "packages/kratt-core/test/semantic-ingestion-runtime.test.mjs"
      - "packages/kratt-core/src/memory-ledger.mjs"
      - "packages/kratt-core/src/contracts.mjs"
      - "packages/kratt-core/test/word-semantic-evidence-bridge.test.mjs"
      - "packages/kratt-core/test/word-semantic-model.test.mjs"
      - "docs/WORD-SEMANTIC-MODEL.md"
      - ".github/workflows/word-semantic-model.yml"

permissions:
  contents: read

jobs:
  word-semantics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax
        run: node --check packages/kratt-core/src/word-semantic-model.mjs
      - name: Run word semantics tests
        run: node --test packages/kratt-core/test/word-semantic-*.test.mjs
