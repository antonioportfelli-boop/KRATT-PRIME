name: CI

on:
  push:
    branches:
      - main
      - feature/kratt-governed-execution-bridge-v1
      - feature/wave2-runtime-reconciliation-2026-11-26
      - feature/wave3-fabric-interoperability-2026-11-26
      - feature/wp-03-8-receiver-dedup-2026-11-26
      - feature/wp-03-9-provider-worker-security-2026-11-26
  pull_request:
    branches: [main]

jobs:
  vite:
    name: typecheck + build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install
        run: npm ci
      - name: KRATT core and orchestration contract tests
        run: node --test packages/kratt-core/test/*.test.mjs packages/kratt-orchestrator/test/*.test.mjs
      - name: Console and local API syntax
        run: node --check products/kratt-prime-console/app.js && node --check packages/kratt-orchestrator/src/local-server.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
