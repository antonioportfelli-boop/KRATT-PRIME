name: CI

on:
  push:
    branches: [main, feature/kratt-telegram-control-plane-v1]
  pull_request:
    branches: [main, feature/kratt-prime-50k-productization-v1]

jobs:
  vite:
    name: typecheck + build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply non-breaking dependency security updates
        run: |
          npm audit fix --package-lock-only
          npm ci
      - name: Enforce dependency security audit
        run: npm audit --audit-level=high
      - name: KRATT core and orchestration contract tests
        run: node --test packages/kratt-core/test/*.test.mjs packages/kratt-orchestrator/test/*.test.mjs
      - name: Console and local API syntax
        run: node --check products/kratt-prime-console/app.js && node --check packages/kratt-orchestrator/src/local-server.mjs && node --check packages/kratt-orchestrator/src/telegram-control-plane.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit verified dependency lock updates
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/feature/kratt-telegram-control-plane-v1'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$TARGET_BRANCH" != "feature/kratt-telegram-control-plane-v1" ]; then
            echo "Refusing dependency write outside the authorized feature branch."
            exit 0
          fi
          git status --short
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency lock changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(deps): remediate npm security advisories"
          git push origin "HEAD:${TARGET_BRANCH}"
