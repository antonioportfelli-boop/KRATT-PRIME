name: CI

on:
  push:
    branches: [main, feature/kratt-governed-execution-bridge-v1, feature/agent-provider-bridge-openai-xai-2026-11-27]
  pull_request:
    branches: [main, feature/wave4-performance-security-hardening-2026-11-27]

jobs:
  vite:
    name: typecheck + build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install
        run: npm ci
      - name: KRATT core and orchestration contract tests
        run: node --test packages/kratt-core/test/*.test.mjs packages/kratt-orchestrator/test/*.test.mjs
      - name: Console, local API and provider gateway syntax
        run: |
          node --check products/kratt-prime-console/app.js
          node --check packages/kratt-orchestrator/src/local-server.mjs
          node --check packages/kratt-orchestrator/src/adapters/responses-api-adapter.mjs
          node --check packages/kratt-orchestrator/src/model-gateway.mjs
          node --check packages/kratt-orchestrator/src/netlify-agent-gateway.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
