name: CI

on:
  push:
    branches: [main, feature/wave10-observatory-hardening-remediation-v1, feature/chiro-x-pattern-intelligence-v1, feature/chiro-x-wave2-intelligence-fabric, repair/org-kratt-ci-contract-2026-11-27]
  pull_request:
    branches: [main, feature/phase10-runtime-observatory-v1, feature/phase11-wave10-reconciled-2026-11-23, feature/chiro-x-pattern-intelligence-v1]

jobs:
  vite:
    name: typecheck + build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Verify locked install inputs
        shell: bash
        run: |
          printf 'Workspace: %s\\n' "$PWD"
          test -s package.json
          test -s package-lock.json
          node --input-type=commonjs -e "const fs = require('node:fs'); const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8')); if (!Number.isInteger(lock.lockfileVersion) || lock.lockfileVersion < 1) process.exit(1); console.log('Lockfile version:', lock.lockfileVersion)"
          printf 'npm package-lock config: '
          npm config get package-lock
      - name: Install
        run: npm ci --package-lock=true
        working-directory: ${{ github.workspace }}
      - name: Contract tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
