name: CI

on:
  push:
    branches: [main, fix/**, feature/**]
  pull_request:
    branches: [main, feature/phase10-runtime-observatory-v1, feature/phase11-wave10-reconciled-2026-11-23, feature/chiro-x-pattern-intelligence-v1]

permissions:
  contents: read

jobs:
  vite:
    name: typecheck + build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Verify checkout root and npm lockfile
        working-directory: ${{ github.workspace }}
        run: |
          test -s package.json
          test -s package-lock.json
          node -e 'const lock = require("./package-lock.json"); if (!Number.isInteger(lock.lockfileVersion) || lock.lockfileVersion < 1 || !lock.packages || !lock.packages[""]) process.exit(1)'
      - name: Install
        run: npm ci --prefix "${{ github.workspace }}"
      - name: Contract tests
        run: npm --prefix "${{ github.workspace }}" test
      - name: Typecheck
        run: npm --prefix "${{ github.workspace }}" run typecheck
      - name: Build
        run: npm --prefix "${{ github.workspace }}" run build
