name: CI

on:
  push:
    branches: [main, feature/kratt-telegram-control-plane-v1]
  pull_request:
    branches: [main, feature/kratt-prime-50k-productization-v1]

jobs:
  vite:
    name: typecheck + build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Dependency vulnerability inventory
        run: |
          npm audit --json > /tmp/kratt-npm-audit.json || true
          node -e 'const a=JSON.parse(require("node:fs").readFileSync("/tmp/kratt-npm-audit.json","utf8")); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, advisories:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==="string"?x:{name:x.name,title:x.title,url:x.url,range:x.range})}))},null,2))'
      - name: KRATT core and orchestration contract tests
        run: node --test packages/kratt-core/test/*.test.mjs packages/kratt-orchestrator/test/*.test.mjs
      - name: Console and local API syntax
        run: node --check products/kratt-prime-console/app.js && node --check packages/kratt-orchestrator/src/local-server.mjs && node --check packages/kratt-orchestrator/src/telegram-control-plane.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
