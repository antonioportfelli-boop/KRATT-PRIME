name: KRATT hardening checks

on:
  push:
    branches:
      - feature/wave4-performance-security-hardening-2026-11-27
      - feature/agent-provider-bridge-openai-xai-2026-11-27
  pull_request:
    branches: [main, feature/wave4-performance-security-hardening-2026-11-27]

permissions:
  contents: read

jobs:
  security-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Core and orchestration tests
        run: npm test
      - name: Syntax checks
        run: |
          node --check packages/kratt-core/src/canonical-request.mjs
          node --check packages/kratt-core/src/security-telemetry.mjs
          node --check packages/kratt-orchestrator/src/adapters/responses-api-adapter.mjs
          node --check packages/kratt-orchestrator/src/model-gateway.mjs
          node --check packages/kratt-orchestrator/src/netlify-agent-gateway.mjs
      - name: Benchmark smoke test
        run: KRATT_BENCH_ITERATIONS=1000 npm run bench:kratt
      - name: Capture npm dependency audit report
        run: npm audit --json > npm-audit.json || echo "npm audit reported advisories; preserve JSON for review"
      - name: Upload npm dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ github.sha }}
          path: npm-audit.json
          if-no-files-found: warn
          retention-days: 14
