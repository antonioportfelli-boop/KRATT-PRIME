name: PostgreSQL Runtime Integration

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/kratt-core/src/postgres-runtime-store.mjs"
      - "packages/kratt-runtime/src/postgres-*.mjs"
      - "packages/kratt-core/migrations/0002_postgres_runtime_and_leases.sql"
      - "packages/kratt-core/test/postgres-runtime*.test.mjs"
      - "packages/kratt-core/src/fabric-interoperability.mjs"
      - "packages/kratt-core/src/fabric-outbound-adapter.mjs"
      - "packages/kratt-core/src/fabric-metrics.mjs"
      - "packages/kratt-core/test/fabric-metrics.test.mjs"
      - "packages/kratt-core/src/postgres-outbox-store.mjs"
      - "packages/kratt-core/src/outbox-worker.mjs"
      - "packages/kratt-core/test/outbox-worker.test.mjs"
      - "packages/kratt-core/migrations/0003_fabric_interoperability.sql"
      - "packages/kratt-core/migrations/0004_fabric_outbound.sql"
      - "packages/kratt-core/migrations/0005_fabric_trust_registry.sql"
      - "packages/kratt-core/migrations/0006_outbox_delivery_reliability.sql"
      - "packages/kratt-core/test/postgres-outbox-reliability.integration.test.mjs"
      - "packages/kratt-core/src/fabric-negotiation-ack.mjs"
      - "packages/kratt-core/src/postgres-fabric-ack-store.mjs"
      - "packages/kratt-core/migrations/0007_fabric_receiver_acknowledgements.sql"
      - "packages/kratt-core/migrations/0008_fabric_receiver_receipts.sql"
      - "packages/kratt-core/migrations/0009_fabric_ack_outbox_reconciliation.sql"
      - "packages/kratt-core/test/fabric-negotiation-ack.test.mjs"
      - "packages/kratt-core/test/postgres-fabric-ack.integration.test.mjs"
      - "packages/kratt-core/src/postgres-fabric-trust-registry.mjs"
      - "packages/kratt-core/test/fabric-steel-contract.test.mjs"
      - "packages/kratt-core/test/fixtures/steel/fabric-v1.ts"
      - "packages/kratt-core/test/postgres-fabric.integration.test.mjs"
      - "packages/kratt-core/test/postgres-fabric-trust.integration.test.mjs"
      - "packages/kratt-core/test/postgres-fabric-outbound.integration.test.mjs"
      - ".github/workflows/postgres-runtime-integration.yml"
  push:
    branches:
      - feature/wave2-runtime-reconciliation-2026-11-26
      - feature/wave3-fabric-interoperability-2026-11-26
      - feature/wp-03-8-receiver-dedup-2026-11-26
      - feature/wp-03-9-provider-worker-security-2026-11-26
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-runtime:
    name: PostgreSQL 16 runtime integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kratt_runtime_test
          POSTGRES_USER: kratt_test
          POSTGRES_PASSWORD: kratt_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kratt_test -d kratt_runtime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run all KRATT core contracts and app checks
        run: npm test && npm run typecheck && npm run build
      - name: Install PostgreSQL driver for isolated integration suite
        run: npm install --no-save --package-lock=false pg@8.16.3
      - name: Run live PostgreSQL journal, leases, Fabric inbox/outbox, trust registry and delivery reliability tests
        env:
          KRATT_TEST_DATABASE_URL: postgres://kratt_test:kratt_test_password@127.0.0.1:5432/kratt_runtime_test
        run: node --test packages/kratt-core/test/postgres-runtime.integration.test.mjs packages/kratt-core/test/postgres-fabric.integration.test.mjs packages/kratt-core/test/postgres-fabric-outbound.integration.test.mjs packages/kratt-core/test/postgres-fabric-trust.integration.test.mjs packages/kratt-core/test/postgres-outbox-reliability.integration.test.mjs packages/kratt-core/test/postgres-fabric-ack.integration.test.mjs
