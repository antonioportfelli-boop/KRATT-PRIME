name: KRATT PRIME CI

on:
  push:
    branches:
      - integration/source-reconciliation-2026-10
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  contract-tests:
    name: KRATT core contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run contract tests
        run: node --test packages/kratt-core/test/*.test.mjs packages/kratt-orchestrator/test/*.test.mjs
  typecheck-build:
    name: Existing app typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
