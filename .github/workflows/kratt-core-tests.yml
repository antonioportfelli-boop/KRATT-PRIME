name: KRATT PRIME CI

on:
  push:
    branches:
      - integration/source-reconciliation-2026-10
      - feature/wave10-observatory-hardening-remediation-v1
      - main
      - feature/**
      - repair/org-kratt-ci-contract-2026-11-27
  pull_request:
    branches:
      - main
      - feature/phase10-runtime-observatory-v1
      - feature/chiro-x-pattern-intelligence-v1

permissions:
  contents: read

jobs:
  contract-tests:
    name: KRATT core contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run contract tests
        run: node --test packages/kratt-core/test/*.test.mjs
  typecheck-build:
    name: Existing app typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
